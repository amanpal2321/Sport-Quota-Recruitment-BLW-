<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sports Quota Registration</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Verdana, Geneva, Tahoma, sans-serif;
      background: url('train.avif') center/cover no-repeat;
      height: 100vh;
    }
    .container {
      background: rgba(255, 255, 255, 0.85);
      width: 480px;
      margin: 40px auto;
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15);
      text-align: center;
      position: relative;
    }
    .logo {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 30px;
      color: #d32f2f;
      border: 2px solid #d32f2f;
    }
    h2 {
      margin: 36px 0 24px 0;
      color: #252525;
      font-size: 1.5em;
    }
    .form-group {
      margin: 14px 0;
      text-align: left;
    }
    label {
      font-size: 1em;
      font-weight: bold;
      display: block;
      margin-bottom: 4px;
    }
    input,
    select {
      width: 100%;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid #bbb;
      font-size: 1em;
      box-sizing: border-box;
    }
    .btn {
      padding: 12px 0;
      width: 48%;
      background: #4285f4;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      cursor: pointer;
      margin: 10px 1%;
      box-shadow: 0 2px 10px #eee;
      transition: background 0.2s;
    }
    .btn.cancel {
      background: #f44336;
    }
    .buttons-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 22px;
    }
    .section {
      margin: 22px 0;
      text-align: left;
    }
    .big-btn {
      padding: 20px 0;
      width: 65%;
      font-size: 1.2em;
      margin: 16px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #eee;
      background: #e3eefc;
      color: #252525;
      border: 1px solid #bdbdbd;
      cursor: pointer;
      font-weight: bold;
    }
    .captcha-box {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      font-size: 1.1em;
      font-weight: bold;
    }
    .qr-box {
      display: flex;
      align-items: center;
      gap: 24px;
    }
    .qr-img {
      width: 100px;
      height: 100px;
      border: 2px solid #bdbdbd;
      background: #fff;
    }
    .success-box {
      padding: 28px 0;
      color: #219150;
      font-weight: bold;
      font-size: 1.22em;
      border-radius: 8px;
      background: #e6fcef;
    }
    .back-btn {
      background: #4285f4;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      margin-top: 22px;
      cursor: pointer;
    }
    .footer {
      text-align: center;
      color: #443;
      font-size: 0.93em;
      margin-top: 48px;
      opacity: 0.7;
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(255, 255, 255, 0.7);
      padding: 8px 0;
    }
  </style>
</head>
<body>
  <div style="width:100%; text-align:left; margin-top:2px;
    margin-bottom:2px;">
  <img src="logo.jpg" alt="Indian Railways Logo" style="height:80px; max-width:220px;">
</div>
  <div class="container" id="page-home">
    <div class="logo">🏅</div>
    <h2>Sports Quota Registration(BLW)</h2>

    <!-- Check Registration Status -->
    <div class="section">
      <form id="status-form" autocomplete="off" onsubmit="return false">
        <div class="form-group">
          <label>Check Registration Status</label>
          <input type="text" placeholder="Enter registration no." id="status-regno" />
        </div>
        <div class="captcha-box">
          <span>Captcha: <b id="captcha-text">NKOVIA</b></span>
          <button type="button" onclick="updateCaptcha()" style="background: #eee; border-radius: 6px; border: none; font-size: 16px; padding: 0 6px; cursor: pointer;">⟳</button>
        </div>
        <div class="form-group">
          <input type="text" placeholder="Enter captcha" id="status-captcha" />
        </div>
        <button type="button" class="btn" style="width: 100%" onclick="checkStatus()">
          Check Status
        </button>
        <div id="status-result" style="margin-top: 10px; color: #1c412b"></div>
      </form>
    </div>
    <!-- Buttons -->
    <button class="big-btn" onclick="showPage('registration')">New Registration</button>
    <button class="big-btn" onclick="showPage('admin-login')">Admin Login</button>
  </div>

  <!-- Registration form -->
  <div class="container" id="page-registration" style="display:none;">
    <div class="logo">🏅</div>
    <h2>New Sports Quota Registration</h2>
    <form id="registration-form" autocomplete="off" onsubmit="return false">
      <div class="form-group"><label>First Name</label>
        <input type="text" id="fname" required />
      </div>
      <div class="form-group"><label>Last Name</label>
        <input type="text" id="lname" required />
      </div>
      <div class="form-group"><label>Mobile Number</label>
        <input type="tel" id="mobile" required pattern="[0-9]{10}" />
      </div>
      <div class="form-group"><label>Email</label>
        <input type="email" id="email" required />
      </div>
      <div class="form-group"><label>Age</label>
        <input type="number" id="age" min="10" max="60" required />
      </div>
      <div class="form-group"><label>Gender</label>
        <select id="gender" required>
          <option value="">--Select--</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group"><label>Sports</label>
        <select id="sports" required>
          <option value="">--Select--</option>
          <option>Football</option>
          <option>Cricket</option>
          <option>Badminton</option>
          <option>Basketball</option>
          <option>Table Tennis</option>
          <option>Swimming</option>
        </select>
      </div>
      <hr style="margin: 18px 0" />
      <div class="form-group">
        <label>Payment</label>
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?data=upi://pay?pa=example@upi&amount=500" alt="QR" class="qr-img" />
          <span>
            <label style="font-size: 0.95em">UPI Address:</label><br />
            <input type="text" id="upi" value="example@upi" placeholder="UPI address" style="width: 160px"/>
          </span>
        </div>
      </div>
      <div class="form-group"><label>UTR Number</label>
        <input type="text" id="utr" required placeholder="Enter UTR number" />
      </div>
      <div class="buttons-flex">
        <button type="button" class="btn" onclick="submitRegistration()">Submit</button>
        <button type="button" class="btn cancel" onclick="showPage('home')">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Admin Login Page -->
  <div class="container" id="page-admin-login" style="display:none;">
    <div class="logo">🔐</div>
    <h2>Admin Login</h2>
    <form id="admin-login-form" autocomplete="off" onsubmit="return false">
      <div class="form-group">
        <label for="admin-userid">User ID</label>
        <input type="text" id="admin-userid" required />
      </div>
      <div class="form-group">
        <label for="admin-password">Password</label>
        <input type="password" id="admin-password" required />
      </div>
      <div class="captcha-box">
        <span>Captcha: <b id="admin-captcha-text"></b></span>
        <button type="button" onclick="updateAdminCaptcha()" style="background: #eee; border-radius: 6px; border: none; font-size: 16px; padding: 0 6px; cursor: pointer;">⟳</button>
      </div>
      <div class="form-group">
        <input type="text" placeholder="Enter captcha" id="admin-captcha-input" />
      </div>
      <div class="buttons-flex">
        <button type="button" class="btn" onclick="adminLogin()">Login</button>
        <button type="button" class="btn cancel" onclick="showPage('home')">Cancel</button>
      </div>
      <div id="admin-login-msg" style="color:red; font-weight:bold; margin-top:10px;"></div>
    </form>
  </div>

  <!-- Approval Page -->
  <div class="container" id="page-approval" style="display:none;">
    <div class="logo">✅</div>
    <h2>Approval</h2>
    <form id="approval-form" autocomplete="off" onsubmit="return false">
      <div class="form-group">
        <label for="approval-regno">Registration No.</label>
        <input type="text" id="approval-regno" required />
      </div>
      <div class="buttons-flex">
        <button type="button" class="btn" onclick="submitApproval()">Approve</button>
        <button type="button" class="btn cancel" onclick="showPage('home')">Logout</button>
      </div>
      <div id="appr-msg" style="color:#398652; margin-top:10px; font-weight:500;"></div>
    </form>
  </div>

  <!-- Success Page -->
  <div class="container" id="page-success" style="display:none;">
    <div class="logo">🏅</div>
    <h2>Registration Successful</h2>
    <div class="success-box">
      Congratulations!<br />
      Your Registration Number is:<br />
      <span id="show-regno" style="font-size:1.17em; color:#2377ec; font-weight:bold;"></span>
    </div>
    <button class="back-btn" onclick="showPage('home')">Back to Home</button>
  </div>

  <div class="footer">
    © 2025 Sports Quota Portal | Contact: info@blw.com
  </div>

  <script>
    // Navigation function
    function showPage(page) {
      document.getElementById("page-home").style.display = page === "home" ? "block" : "none";
      document.getElementById("page-registration").style.display = page === "registration" ? "block" : "none";
      document.getElementById("page-success").style.display = page === "success" ? "block" : "none";
      document.getElementById("page-admin-login").style.display = page === "admin-login" ? "block" : "none";
      document.getElementById("page-approval").style.display = page === "approval" ? "block" : "none";

      document.getElementById("status-result").innerText = "";
      if(page === "home") {
        document.getElementById('status-form').reset();
        updateCaptcha();
      }
      // Clear admin login messages & reset form if leaving admin-login page
      if(page !== "admin-login") {
        document.getElementById("admin-login-msg").innerText = "";
        document.getElementById("admin-login-form").reset();
      }
      // Clear approval messages & reset form if leaving approval
      if(page !== "approval") {
        document.getElementById("appr-msg").innerText = "";
        document.getElementById("approval-form").reset();
      }
    }

    // Captcha for home status check
    function updateCaptcha() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let str = "";
      for (let i=0; i<6; i++) {
        str += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById("captcha-text").innerText = str;
    }

    // Check Status
    function checkStatus() {
      const regno = document.getElementById("status-regno").value.trim();
      const enteredCaptcha = document.getElementById("status-captcha").value.trim().toUpperCase();
      const actualCaptcha = document.getElementById("captcha-text").innerText.toUpperCase();
      const statusResult = document.getElementById("status-result");

      if (!regno) {
        statusResult.innerText = "Please enter your registration number.";
        return;
      }
      if (enteredCaptcha !== actualCaptcha) {
        statusResult.innerText = "Invalid captcha, please try again.";
        updateCaptcha();
        return;
      }
      statusResult.innerText = `Your application with registration number ${regno} is under process.`;
    }

    // Registration submission
    function submitRegistration() {
      const fname = document.getElementById("fname").value.trim();
      const lname = document.getElementById("lname").value.trim();
      const mobile = document.getElementById("mobile").value.trim();
      const email = document.getElementById("email").value.trim();
      const age = document.getElementById("age").value.trim();
      const gender = document.getElementById("gender").value;
      const sports = document.getElementById("sports").value;
      const upi = document.getElementById("upi").value.trim();
      const utr = document.getElementById("utr").value.trim();

      if (!fname || !lname || !mobile || !email || !age || !gender || !sports || !upi || !utr) {
        alert("Please fill all fields.");
        return;
      }
      if (!/^\d{10}$/.test(mobile)) {
        alert("Enter valid 10-digit mobile number.");
        return;
      }
      if (utr.length < 10) {
        alert("Please enter a valid UTR number.");
        return;
      }

      const regNum = "SQ" + new Date().getTime().toString().slice(-6) + Math.floor(Math.random() * 90 + 10);

      document.getElementById("show-regno").innerText = regNum;
      showPage("success");

      document.getElementById("registration-form").reset();
    }

    // Admin login captcha
    function updateAdminCaptcha() {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let str = "";
      for (let i=0; i<6; i++) {
        str += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      document.getElementById("admin-captcha-text").innerText = str;
    }
    updateAdminCaptcha();

    // Admin login function
    function adminLogin() {
      const user = document.getElementById("admin-userid").value.trim();
      const pass = document.getElementById("admin-password").value.trim();
      const captchaInput = document.getElementById("admin-captcha-input").value.trim().toUpperCase();
      const realCaptcha = document.getElementById("admin-captcha-text").innerText.toUpperCase();
      const loginMsg = document.getElementById("admin-login-msg");

      if (!user || !pass || !captchaInput) {
        loginMsg.innerText = "Please fill all fields.";
        return;
      }
      if (captchaInput !== realCaptcha) {
        loginMsg.innerText = "Invalid captcha. Please try again.";
        updateAdminCaptcha();
        return;
      }
      // Hardcoded credentials for demo
      if (user === "admin" && pass === "admin123") {
        loginMsg.innerText = "";
        showPage("approval");
        document.getElementById("admin-login-form").reset();
      } else {
        loginMsg.innerText = "Invalid User ID or Password.";
      }
    }

    // Approval submission
    function submitApproval() {
      const regno = document.getElementById("approval-regno").value.trim();
      const apprMsg = document.getElementById("appr-msg");

      if (!regno) {
        apprMsg.style.color = "#c03";
        apprMsg.innerText = "Please enter a registration number.";
        return;
      }
      apprMsg.style.color = "#398652";
      apprMsg.innerText = `Approved registration #${regno}!`;
      setTimeout(() => {
        apprMsg.innerText = "";
        showPage("home"); // Logout to home
      }, 2000);
    }
  </script>
</body>
</html>
